    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f4f4f4; 
            color: #333;
            overflow: hidden; 
        }

        .header {
            background: #1a3a1a;
            color: #fff;
            text-align: center;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1000;
        }

        #map { 
            height: calc(100vh - 50px); 
            width: 100%; 
            position: absolute;
            top: 50px;
            left: 0;
            z-index: 1;
        }

        /* 产区颜色变量定义 */
        :root {
            --speyside: #d4af37;
            --highland: #2e7d32;
            --islay: #b71c1c;
            --islands: #1565c0;
            --lowland: #5d4037;
            --campbeltown: #e65100;
            --others: #616161;
        }

        /* 动态颜色标记 */
        .region-marker {
            color: #fff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            border: 3px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        /* 底部抽屉样式 (保持不变) */
        .bottom-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-radius: 16px 16px 0 0; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); z-index: 2000; transition: transform 0.3s ease-out; transform: translateY(calc(100% - 60px)); max-height: 70vh; display: flex; flex-direction: column; }
        .bottom-sheet.expanded { transform: translateY(0); }
        .sheet-handle { padding: 10px 0; text-align: center; cursor: pointer; flex-shrink: 0; }
        .sheet-handle::before { content: ''; display: inline-block; width: 40px; height: 5px; background: #ccc; border-radius: 3px; }
        .sheet-header { padding: 0 15px 10px; font-size: 16px; font-weight: bold; color: #1a3a1a; border-bottom: 1px solid #eee; flex-shrink: 0; }
        .sheet-content { overflow-y: auto; padding: 0 15px 20px; flex: 1; -webkit-overflow-scrolling: touch; }
        
        .legend-item { padding: 12px 0; border-bottom: 1px dashed #eee; font-size: 14px; display: flex; align-items: center; cursor: pointer; }
        .legend-item:active { background: #f9f9f9; }
        .legend-num { font-weight: bold; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; margin-right: 10px; flex-shrink: 0; }
        .legend-name { flex: 1; font-weight: 500; }
        
        .status-active { color: #2e7d32; font-size: 12px; }
        .status-closed { color: #999; font-style: italic; font-size: 12px; }
        .status-demolished { color: #b71c1c; text-decoration: line-through; font-size: 12px; }

        /* 弹窗优化 */
        .leaflet-popup-content-wrapper { border-radius: 8px; box-shadow: 0 3px 14px rgba(0,0,0,0.2); }
        .leaflet-popup-content { margin: 10px 14px; font-size: 14px; line-height: 1.5; }
    </style>
</head>

        // 5. 渲染逻辑
        var markers = []; 
        var legendList = document.getElementById('legend-list');
        var bottomSheet = document.getElementById('bottomSheet');
        var sheetToggle = document.getElementById('sheetToggle');

        sheetToggle.addEventListener('click', function() {
            bottomSheet.classList.toggle('expanded');
        });

        // 遍历数据
        distilleriesData.forEach(function(item) {
            var id = item.id;
            var name = item.name;
            var region = item.region || 'Others';
            var status = item.status || 'Active';
            var lat = item.latitude;
            var lng = item.longitude;

            // 获取对应产区的颜色
            var bgColor = getColorByRegion(region);

            // 创建自定义标记图标
            var numberIcon = L.divIcon({
                className: '', 
                html: `<div class="region-marker" style="background: ${bgColor}">${id}</div>`,
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });

            var marker = L.marker([lat, lng], { icon: numberIcon }).addTo(map);
            
            // 弹窗内容增加产区和状态
            marker.bindPopup(`<strong>${id}. ${name}</strong><br>
                             <span style="color:#666; font-size:12px;">产区: ${region} | 状态: ${status}</span>`);
            markers.push(marker);

            // 创建右侧列表项
            var itemElem = document.createElement('div');
            itemElem.className = 'legend-item';
            
            var statusClass = 'status-active';
            if (status.toLowerCase().includes('closed')) statusClass = 'status-closed';
            if (status.toLowerCase().includes('demolished')) statusClass = 'status-demolished';

            itemElem.innerHTML = `
                <span class="legend-num" style="background: ${bgColor}">${id}</span> 
                <span class="legend-name">${name}</span> 
                <span class="${statusClass}">${status}</span>
            `;

            itemElem.addEventListener('click', function() {
                map.flyTo([lat, lng], 13); 
                marker.openPopup();
                bottomSheet.classList.remove('expanded'); 
            });

            legendList.appendChild(itemElem);
        });
    </script>
</body>
</html>
